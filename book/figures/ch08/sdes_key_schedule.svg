<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" font-family="monospace, sans-serif" font-size="13">

  <!-- ===== BACKGROUND ===== -->
  <rect width="780" height="560" fill="#f9f9fb" rx="12"/>

  <!-- ===== TITLE ===== -->
  <text x="390" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">S-DES Key Schedule — How C and D produce K₁, K₂, K₃</text>

  <!-- ===== MASTER KEY BOX ===== -->
  <rect x="240" y="50" width="300" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="390" y="64" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">Master Key  k₁ k₂ k₃ k₄ k₅ k₆ k₇ k₈ k₉ k₁₀</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#1e40af">(10 bits)</text>

  <!-- arrow down to P10 -->
  <line x1="390" y1="88" x2="390" y2="106" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== P10 BOX ===== -->
  <rect x="315" y="106" width="150" height="32" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="127" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">P10</text>

  <!-- arrow down to split -->
  <line x1="390" y1="138" x2="390" y2="160" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== SPLIT LABEL ===== -->
  <text x="390" y="157" text-anchor="middle" font-size="11" fill="#555">split into two 5-bit halves</text>

  <!-- Split line -->
  <line x1="200" y1="172" x2="580" y2="172" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- left branch line -->
  <line x1="280" y1="172" x2="280" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- right branch line -->
  <line x1="500" y1="172" x2="500" y2="185" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- branch T from P10 -->
  <line x1="390" y1="160" x2="280" y2="172" stroke="#555" stroke-width="1.5"/>
  <line x1="390" y1="160" x2="500" y2="172" stroke="#555" stroke-width="1.5"/>

  <!-- ===== C0 BOX ===== -->
  <rect x="195" y="185" width="170" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="280" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">C₀  (bits 1–5)</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#15803d">Left half — 5 bits</text>

  <!-- ===== D0 BOX ===== -->
  <rect x="415" y="185" width="170" height="34" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="500" y="199" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">D₀  (bits 6–10)</text>
  <text x="500" y="212" text-anchor="middle" font-size="11" fill="#9d174d">Right half — 5 bits</text>

  <!-- ============================================================ -->
  <!-- ROUND 1 -->
  <!-- ============================================================ -->
  <text x="390" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">── Round 1: LS-1 (rotate left by 1) ──────────────────────</text>

  <!-- C0 -> LS1 -> C1 -->
  <line x1="280" y1="219" x2="280" y2="248" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <rect x="215" y="248" width="130" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">LS-1  →  C₁</text>

  <!-- D0 -> LS1 -> D1 -->
  <line x1="500" y1="219" x2="500" y2="248" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrowP)"/>
  <rect x="435" y="248" width="130" height="28" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.3"/>
  <text x="500" y="266" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="bold">LS-1  →  D₁</text>

  <!-- C1 + D1 join -> P8 -> K1 -->
  <line x1="345" y1="262" x2="365" y2="282" stroke="#555" stroke-width="1.3"/>
  <line x1="435" y1="262" x2="415" y2="282" stroke="#555" stroke-width="1.3"/>
  <text x="390" y="280" text-anchor="middle" font-size="10" fill="#555">C₁ ‖ D₁  (10 bits)</text>
  <line x1="390" y1="282" x2="390" y2="293" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="332" y="293" width="116" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="390" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">P8 → K₁ (8 bits)</text>

  <!-- ============================================================ -->
  <!-- ROUND 2 -->
  <!-- ============================================================ -->
  <text x="390" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">── Round 2: LS-2 (rotate left by 2) ──────────────────────</text>

  <!-- C1 -> LS2 -> C2 -->
  <line x1="280" y1="276" x2="280" y2="348" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <rect x="215" y="348" width="130" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">LS-2  →  C₂</text>

  <!-- D1 -> LS2 -> D2 -->
  <line x1="500" y1="276" x2="500" y2="348" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>
  <rect x="435" y="348" width="130" height="28" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.3"/>
  <text x="500" y="366" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="bold">LS-2  →  D₂</text>

  <!-- C2 + D2 join -> P8 -> K2 -->
  <line x1="345" y1="362" x2="365" y2="382" stroke="#555" stroke-width="1.3"/>
  <line x1="435" y1="362" x2="415" y2="382" stroke="#555" stroke-width="1.3"/>
  <text x="390" y="380" text-anchor="middle" font-size="10" fill="#555">C₂ ‖ D₂  (10 bits)</text>
  <line x1="390" y1="382" x2="390" y2="393" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="332" y="393" width="116" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="390" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">P8 → K₂ (8 bits)</text>

  <!-- ============================================================ -->
  <!-- ROUND 3 -->
  <!-- ============================================================ -->
  <text x="390" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">── Round 3: LS-2 (rotate left by 2) ──────────────────────</text>

  <!-- C2 -> LS2 -> C3 -->
  <line x1="280" y1="376" x2="280" y2="448" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>
  <rect x="215" y="448" width="130" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.3"/>
  <text x="280" y="466" text-anchor="middle" font-size="12" fill="#15803d" font-weight="bold">LS-2  →  C₃</text>

  <!-- D2 -> LS2 -> D3 -->
  <line x1="500" y1="376" x2="500" y2="448" stroke="#db2777" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>
  <rect x="435" y="448" width="130" height="28" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="1.3"/>
  <text x="500" y="466" text-anchor="middle" font-size="12" fill="#9d174d" font-weight="bold">LS-2  →  D₃</text>

  <!-- C3 + D3 join -> P8 -> K3 -->
  <line x1="345" y1="462" x2="365" y2="482" stroke="#555" stroke-width="1.3"/>
  <line x1="435" y1="462" x2="415" y2="482" stroke="#555" stroke-width="1.3"/>
  <text x="390" y="480" text-anchor="middle" font-size="10" fill="#555">C₃ ‖ D₃  (10 bits)</text>
  <line x1="390" y1="482" x2="390" y2="493" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="332" y="493" width="116" height="26" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
  <text x="390" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">P8 → K₃ (8 bits)</text>

  <!-- ===== LEGEND ===== -->
  <rect x="30" y="180" width="148" height="80" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="104" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">C (left half)</text>
  <text x="104" y="211" text-anchor="middle" font-size="10" fill="#15803d">Green boxes / lines</text>
  <rect x="30" y="270" width="148" height="80" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1"/>
  <text x="104" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d174d">D (right half)</text>
  <text x="104" y="301" text-anchor="middle" font-size="10" fill="#9d174d">Pink boxes / lines</text>
  <rect x="30" y="360" width="148" height="60" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="104" y="376" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">P8 / P10</text>
  <text x="104" y="391" text-anchor="middle" font-size="10" fill="#92400e">Permutation steps</text>

  <!-- ===== NOTE bottom ===== -->
  <rect x="30" y="440" width="148" height="80" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1"/>
  <text x="104" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#0369a1">Total shift = 5 bits</text>
  <text x="104" y="471" text-anchor="middle" font-size="10" fill="#0369a1">1 + 2 + 2 = 5 = width</text>
  <text x="104" y="486" text-anchor="middle" font-size="10" fill="#0369a1">So C₃ = C₀, D₃ = D₀</text>
  <text x="104" y="501" text-anchor="middle" font-size="10" fill="#0369a1">(full cycle!)</text>

  <!-- ===== ARROW MARKERS ===== -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#db2777"/>
    </marker>
  </defs>

</svg>
